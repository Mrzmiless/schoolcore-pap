<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SchoolCore — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/home-content.css">
  <link rel="stylesheet" href="../../assets/css/notice.css">
  <link rel="stylesheet" href="../../assets/css/loading-overlay.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/refresh.css">
</head>
<body>
  <main>
    <div id="dashboard" class="view">
      <section class="home-card greeting-card" aria-labelledby="welcome">
        <p class="eyebrow">SchoolCore</p>
        <h2 id="welcome">Welcome to SchoolCore</h2>
      </section>
      <section class="home-card posts-card" aria-labelledby="posts-heading">
        <div class="card-heading"><h2 id="posts-heading">Posts</h2></div>
        <!-- A publicação mais recente também abre a lista completa. -->
        <button id="open-posts" class="posts-preview" type="button">
          <span id="latest-title">Loading…</span>
          <span id="latest-body" class="preview-body"></span>
          <span id="latest-meta" class="post-meta"></span>
          <span class="preview-action">View all posts <span aria-hidden="true">→</span></span>
        </button>
      </section>
      <section class="home-card calendar" aria-labelledby="calendar-title">
        <h2 id="calendar-title">Calendar</h2>
        <div class="calendar-heading">
          <button id="calendar-prev" type="button" aria-label="Previous month">‹</button>
          <h3 id="calendar-month" aria-live="polite"></h3>
          <button id="calendar-next" type="button" aria-label="Next month">›</button>
        </div>
        <div id="calendar-weekdays" class="calendar-grid calendar-weekdays" aria-hidden="true"></div>
        <div id="calendar-days" class="calendar-grid"></div>
      </section>
    </div>
    <!-- Vista separada para a lista e para o formulário visível aos administradores. -->
    <section id="posts-view" class="view" aria-labelledby="all-posts-title" hidden>
      <div class="posts-header">
        <button id="back-home" class="back-button" type="button" aria-label="Back to home">←</button>
        <h2 id="all-posts-title" tabindex="-1">All posts</h2>
      </div>
      <section id="post-create" class="home-card" hidden>
        <h3>Create a post</h3>
        <form id="post-form">
          <label for="post-title">Title</label>
          <input id="post-title" name="title" type="text" maxlength="120" required>
          <label for="post-body">Message</label>
          <textarea id="post-body" name="body" rows="5" maxlength="5000" required></textarea>
          <button id="post-submit" class="action-button" type="submit">Publish</button>
          <p id="post-form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <div id="posts-list" class="posts-list"></div>
      <p id="posts-status" role="status" aria-live="polite"></p>
      <button id="posts-retry" class="action-button" type="button" hidden>Try again</button>
      <button id="posts-more" class="action-button" type="button" hidden>Load more</button>
    </section>
  </main>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../loading.js"></script>
  <script src="../../assets/js/preferences.js"></script>
  <script src="../../assets/js/home-content.js"></script>
  <script src="../../assets/js/refresh.js"></script>
</body>
</html>
