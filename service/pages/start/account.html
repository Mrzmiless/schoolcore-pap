<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10322D">
  <title>SchoolCore — Account</title>
  <script>if (window.self !== window.top && new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #10322D; color: white; font-family: 'MuseoModerno', 'Trebuchet MS', sans-serif; }
    .topbar { min-height: calc(63px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 24px 0; border-radius: 0 0 15px 15px; background: #2E493E; display: flex; align-items: center; justify-content: space-between; }
    .topbar img { width: 63px; height: 63px; object-fit: contain; }
    .topbar h1 { color: #C9FFDB; font-size: 16px; margin: 0; }
    main { width: min(100%, 480px); margin: 0 auto; padding: 28px 24px calc(112px + env(safe-area-inset-bottom, 0px)); }
    .card { padding: 26px; border-radius: 22px; background: #173f38; }
    h1 { color: #c9ffdb; font-size: 1.6rem; }
    p, li { line-height: 1.6; }
    .account-details { margin: 24px 0; }
    .account-details div { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
    .account-details dt { color: #c9ffdb; font-size: .85rem; font-weight: bold; }
    .account-details dd { margin: 5px 0 0; overflow-wrap: anywhere; }
    button { border: 0; border-radius: 24px; padding: 14px 22px; background: #597d6e; color: white; font: inherit; font-weight: bold; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    button:disabled { opacity: .6; }
    .navigation { position: fixed; z-index: 2; left: 50%; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; width: min(334px, calc(100% - 24px)); min-height: 62px; padding: 4px; border-radius: 20px; background: #5F7D6A; }
    .navigation a, .navigation button { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 48px; padding: 4px 1px; border: 0; border-radius: 12px; background: transparent; color: #fff; font: 700 12px/1.2 'MuseoModerno', 'Trebuchet MS', sans-serif; text-align: center; text-decoration: none; cursor: pointer; }
    .navigation [aria-current="page"] { background: rgba(16,50,45,.35); }
    .navigation button:disabled { opacity: .5; cursor: not-allowed; }
    a:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .embedded .topbar, .embedded .navigation { display: none; }
    .embedded main { padding-bottom: 28px; }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="../../image.png" alt="SchoolCore">
    <h1>User</h1>
  </header>
  <main>
    <section class="card" id="home" hidden>
      <h1 id="home-title">Welcome to SchoolCore</h1>
      <h2>Account details</h2>
      <dl class="account-details">
        <div><dt>Account ID</dt><dd id="account-id"></dd></div>
        <div><dt>Username</dt><dd id="account-username"></dd></div>
        <div><dt>First name</dt><dd id="account-first-name"></dd></div>
        <div><dt>Last name</dt><dd id="account-last-name"></dd></div>
        <div><dt>Email</dt><dd id="account-email"></dd></div>
        <div><dt>Phone number</dt><dd id="account-phone"></dd></div>
        <div><dt>Grade</dt><dd id="account-grade"></dd></div>
        <div><dt>Class</dt><dd id="account-class"></dd></div>
        <div><dt>Role</dt><dd id="account-role"></dd></div>
        <div><dt>Date of birth</dt><dd id="account-birth"></dd></div>
        <div><dt>Account created</dt><dd id="account-created"></dd></div>
        <div><dt>Account status</dt><dd id="account-status"></dd></div>
        <div><dt>Introduction completed</dt><dd id="account-intro"></dd></div>
      </dl>
      <button id="logout" type="button">Sign out</button>
    </section>
    <p id="status" role="status" aria-live="polite">Loading…</p>
  </main>
  <nav class="navigation" aria-label="Main navigation">
    <button type="button" disabled title="School information is coming soon">SInfo</button>
    <button type="button" disabled title="Bar is coming soon">Bar</button>
    <a href="./HomePage.html">Home</a>
    <button type="button" disabled title="Lunch booking is coming soon">Lunch</button>
    <a href="./account.html" aria-current="page">User</a>
  </nav>
  <script src="../../loading.js"></script>
  <script>
    const home = document.getElementById('home');
    const status = document.getElementById('status');

    function displayValue(id, value) {
      document.getElementById(id).textContent = value || 'Not available';
    }

    function displayDate(value) {
      if (!value) return 'Not available';
      // Older accounts may store the date as DD/MM/YYYY instead of BSON date.
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(value)) return value;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Not available' : date.toLocaleDateString('en-GB', { timeZone: 'UTC' });
    }

    async function loadUser() {
      try {
        const response = await fetch('../../api/me', { cache: 'no-store' });
        if (response.status === 401) { window.location.replace('../login/index.html'); return; }
        if (!response.ok) throw new Error();
        const user = await response.json();
        const name = user.first_name || user.username;
        document.getElementById('home-title').textContent = 'Hello, ' + name + '!';
        displayValue('account-id', user.id);
        displayValue('account-username', user.username);
        displayValue('account-first-name', user.first_name);
        displayValue('account-last-name', user.last_name);
        displayValue('account-email', user.email);
        displayValue('account-phone', user.phone_number);
        displayValue('account-grade', user.grade);
        displayValue('account-class', user.class);
        displayValue('account-role', ({ aluno: 'Student', professor: 'Teacher', admin: 'Administrator' })[user.role] || user.role);
        displayValue('account-birth', displayDate(user.date_of_birth));
        displayValue('account-created', displayDate(user.created_at));
        displayValue('account-status', user.is_active ? 'Active' : 'Disabled');
        displayValue('account-intro', user.is_first_login_done ? 'Yes' : 'No');
        home.hidden = false;
        status.textContent = '';
      } catch (error) {
        status.textContent = 'Could not load your account. Refresh the page to try again.';
      }
    }

    document.getElementById('logout').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      window.schoolcoreLoading.show('Signing out...');
      try {
        const response = await fetch('../../api/logout', { method: 'POST' });
        if (!response.ok) throw new Error();
        await window.schoolcoreLoading.wait();
        (window.self !== window.top ? window.top : window).location.replace('../login/index.html');
      } catch (error) {
        status.textContent = 'Could not sign out. Please try again.';
        await window.schoolcoreLoading.hide();
        button.disabled = false;
      }
    });
    loadUser();
  </script>
</body>
</html>
